<h3>Books list</h3>
<hr>
<div
  class="alert"
  *ngIf="message"
  [class.alert-danger]="level === 'error'"
  [class.alert-success]="level === 'success'"
>
{{message}}
</div>

<div class="d-flex gap-2 justify-content-start flex-wrap">
  <app-book-card
    *ngFor="let book of bookResponse.content"
    [book]="book"
    (borrow)="borrowBook($event)"
    ></app-book-card>
</div>

<div class="d-flex justify-content-center mt-3">
  <nav aria-label="Page navigation example">
    <ul class="pagination">

      <li class="page-item">
        <a class="page-link" href="javascript:void(0)" (click)="goToFirstPage()" aria-label="Previous" [class.disabled]="page == 0">
          <i class="fa-solid fa-angles-left"></i>
        </a>
      </li>

      <li class="page-item">
        <a class="page-link" href="javascript:void(0)" (click)="goToPreviousPage()" aria-label="Previous" [class.disabled]="page == 0">
          <i class="fa-solid fa-angle-left"></i>
        </a>
      </li>

      <li class="page-item" *ngFor="let _ of [].constructor(this.bookResponse.totalPages); let pageIndex = index">
        <a class="page-link" href="javascript:void(0)" (click)="goToPage(pageIndex)" aria-label="Previous" [class.active]="page == pageIndex" >
          {{ pageIndex + 1 }}
        </a>
      </li>

      <li class="page-item">
        <a class="page-link" href="javascript:void(0)" (click)="goToNextPage()" aria-label="Next" [class.disabled]="isLastPage">
          <i class="fa-solid fa-chevron-right"></i>
        </a>
      </li>

      <li class="page-item">
        <a class="page-link" href="javascript:void(0)" (click)="goToLastPage()" aria-label="Previous" [class.disabled]="isLastPage">
          <i class="fa-solid fa-angles-right"></i>
        </a>
      </li>

    </ul>
  </nav>
</div>
