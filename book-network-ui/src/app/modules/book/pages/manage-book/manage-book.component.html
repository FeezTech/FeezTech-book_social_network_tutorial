<div class="p-2">
  <h2>Manage my books</h2>
  <hr>
    @if (errorMessage.length) {
      <div class="alert alert-danger mt-2" role="alert">
        @for (message of errorMessage; track message) {
          <p class="p-0 m-0">
            {{ message }}
          </p>
        }
      </div>
    }
    <div class="d-flex gap-2">
      <div class="col-3">
        <img class="rounded-1" width="100%" height="100%" [src]="selectedPicture || 'https://picsum.photos/seed/book1/1900/800'" alt="...">
        <div class="mt-2">
          <input class="form-control" type="file" id="formFile" accept="image/*" (change)="onFileSelected($event)">
        </div>
      </div>
      <div class="col-9">
        <form class="row g-3 fw-bold">

          <div class="col-12">
            <label for="title" class="form-label">Title:</label>
            <input type="text" name="title" class="form-control" id="title" [(ngModel)]="bookRequest.title" placeholder="Book title">
          </div>


          <div class="col-6">
            <label for="author" class="form-label">Author name:</label>
            <input type="text" name="author" class="form-control" id="author" [(ngModel)]="bookRequest.authorName" placeholder="Author name">
          </div>

          <div class="col-6">
            <label for="isbn" class="form-label">isbn:</label>
            <input type="text" name="isbn" class="form-control" id="isbn" [(ngModel)]="bookRequest.isbn" placeholder="ISBN">
          </div>

          <div class="col-12">
            <label for="synopsis" class="form-label">Synopsis:</label>
            <textarea class="form-control" name="synopsis"  id="synopsis" rows="4" [(ngModel)]="bookRequest.synopsis" placeholder="Book synopsis"></textarea>
          </div>


          <div class="col-12">
            <input class="form-check-input" name="shareable" type="checkbox" id="shareme" [(ngModel)]="bookRequest.shareable">
            <label for="shareme" class="form-check-label">&nbsp;Share me</label>
          </div>

          <div class="d-flex justify-content-end gap-2 col-12">
            <button (click)="saveBook()" type="submit" class="btn btn-outline-primary">
              <i class="fas fa-save"></i>&nbsp;Save
            </button>
            <a routerLink="/books/my-books" class="btn btn-link text-danger">
              <i class="fas fa-times"></i>&nbsp;Cancel
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
