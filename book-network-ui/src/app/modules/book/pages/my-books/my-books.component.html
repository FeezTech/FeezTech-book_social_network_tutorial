<h3>My Books List</h3>
<hr>

  <div class="d-flex justify-content-end mb-3">
    <a routerLink='/books/manage' class="btn btn-outline-primary">
      <i class="fas fa-plus"></i>&nbsp;New book
    </a>
  </div>

  <div class="d-flex gap-2 justify-content-start flex-wrap">
    @for (book of bookResponse.content; track book) {
      <app-book-card
        [book]="book"
        [manage]="true"
        (archive)="archiveBook($event)"
        (share)="shareBook($event)"
        (edit)="editBook($event)"
      ></app-book-card>
    }
  </div>


  <div class="d-flex justify-content-center mt-3">
    <nav aria-label="Page navigation example">
      <ul class="pagination">

        <li class="page-item">
          <a class="page-link" href="javascript:void(0)" (click)="goToFirstPage()" aria-label="Previous" [class.disabled]="page == 0">
            <i class="fa-solid fa-angles-left"></i>
          </a>
        </li>

        <li class="page-item">
          <a class="page-link" href="javascript:void(0)" (click)="goToPreviousPage()" aria-label="Previous" [class.disabled]="page == 0">
            <i class="fa-solid fa-angle-left"></i>
          </a>
        </li>

        @for (_ of [].constructor(this.bookResponse.totalPages); track _; let pageIndex = $index) {
          <li class="page-item">
            <a class="page-link" href="javascript:void(0)" (click)="goToPage(pageIndex)" aria-label="Previous" [class.active]="page == pageIndex" >
              {{ pageIndex + 1 }}
            </a>
          </li>
        }

        <li class="page-item">
          <a class="page-link" href="javascript:void(0)" (click)="goToNextPage()" aria-label="Next" [class.disabled]="isLastPage">
            <i class="fa-solid fa-chevron-right"></i>
          </a>
        </li>

        <li class="page-item">
          <a class="page-link" href="javascript:void(0)" (click)="goToLastPage()" aria-label="Previous" [class.disabled]="isLastPage">
            <i class="fa-solid fa-angles-right"></i>
          </a>
        </li>

      </ul>
    </nav>
  </div>
