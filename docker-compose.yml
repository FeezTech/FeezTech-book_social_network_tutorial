version: "3.9"

services:
  postgres:
    container_name: postgres-sql-bsn
    image: postgres
    environment:
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
      PGDATA: /var/lib/postgresql/data
      POSTGRES_DB: book_social_network
    volumes:
      - postgres:/data/postgres
    ports:
      - "5432:5432"
    networks:
      - spring-demo
    restart: unless-stopped

  mail-dev:
    container_name: mail-dev-bsn
    image: maildev/maildev
    ports:
      - "1080:1080"
      - "1025:1025"
    networks:
      - spring-demo

  bsn-api:
    container_name: bsn-api
    image: bsn/bsn:${APP_VERSION}
    ports:
      - "8088:8088"
    networks:
      - spring-demo
    depends_on:
      - postgres
    environment:
      DB_URL: jdbc:postgresql://localhost:5432/book_social_network
      ACTIVE_PROFILE: ${ACTIVE_PROFILE}
      JAR_VERSION: ${APP_VERSION}
      EMAIL_HOSTNAME: ${EMAIL_HOSTNAME}
      EMAIL_USERNAME: ${EMAIL_USERNAME}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}

  bsn-ui:
    container_name: bsn-ui
    image: bsn/bsn-ui:1.0.3
    ports:
      - "8081:80"
    networks:
      - spring-demo
    depends_on:
      - bsn-api

  keycloak:
    container_name: keycloak-bsn
    image: quay.io/keycloak/keycloak:24.0.2
    ports:
      - "9090:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_PASSWORD: admin
    networks:
      - spring-demo
    command:
      - "start-dev"

networks:
  spring-demo:
    driver: bridge
  spring-network:
    driver: bridge


volumes:
  postgres:
    driver: local
