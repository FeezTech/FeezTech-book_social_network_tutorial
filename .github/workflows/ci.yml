name: Java CI with Maven

on:
  push:
    branches: [ main, ci/pipeline ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd book-network-ui
          npm ci

      - name: Build Angular App
        run: |
          cd book-network-ui
          npm run build

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Grant execute permission to mvnw
        run: chmod +x ./mvnw
        working-directory: book-network

      - name: Build with Maven
        run: ./mvnw clean install
        working-directory: book-network

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_IP_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /path/to/your/app

            # Pull latest image from Docker Hub
            docker pull your-dockerhub-username/bsn:1.0.3

            # Generate .env file dynamically
            echo "APP_VERSION=1.0.3" > .env
            echo "ACTIVE_PROFILE=prod" >> .env
            echo "DB_HOST=postgres-sql-bsn" >> .env
            echo "DB_PORT=5432" >> .env
            echo "DB_NAME=book_social_network" >> .env
            echo "DB_USER=${{ secrets.DB_USER }}" >> .env
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
            echo "DB_URL=jdbc:postgresql://postgres-sql-bsn:5432/book_social_network" >> .env
            echo "EMAIL_HOSTNAME=smtp.gmail.com" >> .env
            echo "EMAIL_USERNAME=${{ secrets.EMAIL_USERNAME }}" >> .env
            echo "EMAIL_PASSWORD=${{ secrets.EMAIL_PASSWORD }}" >> .env

            # Rebuild and restart services with new .env
            docker compose --env-file .env down
            docker compose --env-file .env up -d --build
