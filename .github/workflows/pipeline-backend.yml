name: BSN Backend API Pipeline

on:
  push:
    branches:
      - ci/pipeline
    paths:
      - book-network/**
      - docker/backend/**
      - 'docker-compose.yml'
      - .github/workflows/*-backend.yml

jobs:
  compile:
    runs-on: ubuntu
    name: Compile project
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up JDK for java21
        uses: actions/setup-jdk@v3
        with:
          java-version: 21
          distribution: 'corretto'

      - name: Compile project
        run: |
          cd book-network
          ./mvnw clean compile

      #- name: Give permission to Maven wrapper
        #run: chmod +x book-network/mvnw

      #- name: Build with Maven
        #run: |
          #cd book-network
          #./mvnw clean install

  #<<<<Unit Test>>>>>

  unit-tests:
    runs-on: ubuntu
    name: Unit tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up JDK fo java21
        uses: actions/setup-jdk@v3
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Running unit Tests
        run: |
          cd book-network
          ./mvnw clean test
  

  build:
    runs-on: ubuntu
    name: Build backend
    needs: [ compile, unit-tests ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup JDK for java21
        uses: actions/setup-jdk@v3
        with:
          java-version: 21
          distribution: 'corretto'

      - name: Build project
        run: |
          cd book-network
          ./mvnw clean package

  #<<<<Build Docker Image>>>>>
  build-image:
    name: Build Docker Image
    runs-on: ubuntu
    needs: [ build ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup JDK
        uses: actions/setup-jdk@v3
        with:
          java-version: 21
          distribution: 'corretto'

      - name: Build Project
        run: |
          cd book-network
          ./mvnw clean package

      - name: Extract project version
        id: extract_version
        run: |
          cd book-network
          VERSION=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "VERSION=$VERSION"
          echo "version=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image and Push to DockerHub
        uses: docker/build-push-action@v5
        with:
          context: book-network
          file: docker/backend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/bsn-api:${{ steps.extract_version.outputs.version }},${{ secrets.DOCKERHUB_USERNAME }}/bsn-api:latest
          build-args: |
            PROFILE=dev
            APP_VERSION=${{ steps.extract_version.outputs.version }}
  

  deploy:
    name: Deploy Backend
    runs-on: ubuntu
    needs: [ build-image ]
    steps:
      - name: Create Deployment folder
        run: ssh ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_IP }} "mkdir -p ci-cd"

      - name: Copy docker-compose file
        run: scp docker-compose.yml ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_IP }}:ci-cd/docker-compose.yml

      - name: set ENV variables and deploy
        run: |
          ssh ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_IP }} <<EOFt
          export EMAIL_HOSTNAME=${{ secrets.EMAIL_HOSTNAME }}
          export EMAIL_USERNAME=${{ secrets.EMAIL_USERNAME }}
          export EMAIL_PASSWORD=${{ secrets.EMAIL_PASSWORD }} 
          cd ci-cd
          docker compose --env-file .env -f docker-compose.yml pull -q
          docker compose --env-file .env -f docker-compose.yml up -d
          EOF

      #- name: set ENV variables and deploy
        #run: |
          #scp .env ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_IP_HOST }}:ci-cd/.env


  
          
